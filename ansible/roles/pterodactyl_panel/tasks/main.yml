---
- name: Configure Pterodactyl Panel stack
  when: pterodactyl_panel_enabled | bool
  block:
    - name: Require Pterodactyl secrets
      ansible.builtin.assert:
        that:
          - vault_pterodactyl_db_password is defined
          - vault_pterodactyl_db_password | length >= 24
          - vault_pterodactyl_db_root_password is defined
          - vault_pterodactyl_db_root_password | length >= 24
          - vault_pterodactyl_app_key is defined
          - vault_pterodactyl_app_key is match('^base64:.+')
          - vault_pterodactyl_hashids_salt is defined
          - vault_pterodactyl_hashids_salt | length >= 32
        fail_msg: >-
          Define the Pterodactyl DB passwords, APP_KEY, and HASHIDS_SALT
          in the encrypted inventory/group_vars/games/vault.yml.
      no_log: true

    - name: Create Pterodactyl directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode | default('0755') }}"
      loop:
        - { path: /etc/pterodactyl, mode: "0750" }
        - { path: "{{ pterodactyl_data_dir }}" }
        - { path: "{{ pterodactyl_data_dir }}/database" }
        - { path: "{{ pterodactyl_data_dir }}/redis" }
        - { path: "{{ pterodactyl_data_dir }}/var" }
        - { path: "{{ pterodactyl_data_dir }}/nginx" }
        - { path: "{{ pterodactyl_data_dir }}/certs" }
        - { path: "{{ pterodactyl_data_dir }}/logs" }

    - name: Install Pterodactyl database environment
      ansible.builtin.template:
        src: database.env.j2
        dest: /etc/pterodactyl/database.env
        owner: root
        group: root
        mode: "0600"
      no_log: true
      register: pterodactyl_db_env

    - name: Install Pterodactyl Panel environment
      ansible.builtin.template:
        src: panel.env.j2
        dest: /etc/pterodactyl/panel.env
        owner: root
        group: root
        mode: "0600"
      no_log: true
      register: pterodactyl_panel_env

    # Migration from the old Quadlet setup.
    - name: Stop legacy Pterodactyl Quadlet services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - pterodactyl-panel.service
        - pterodactyl-cache.service
        - pterodactyl-db.service
        - pterodactyl-network.service
      failed_when: false

    - name: Remove legacy Pterodactyl Quadlets
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/containers/systemd/pterodactyl-panel.container
        - /etc/containers/systemd/pterodactyl-cache.container
        - /etc/containers/systemd/pterodactyl-db.container
        - /etc/containers/systemd/pterodactyl.network

    - name: Reload systemd after removing Quadlets
      ansible.builtin.systemd:
        daemon_reload: true

    # One generic Podman lifecycle service handles reboot/shutdown.
    - name: Enable Podman restart service
      ansible.builtin.systemd:
        name: podman-restart.service
        enabled: true

    - name: Create Pterodactyl Podman network
      containers.podman.podman_network:
        name: pterodactyl-panel
        subnet: "{{ pterodactyl_podman_subnet }}"
        state: present

    - name: Run Pterodactyl MariaDB
      containers.podman.podman_container:
        name: pterodactyl-db
        image: "{{ pterodactyl_database_image }}"
        state: started
        pull: missing

        network:
          - pterodactyl-panel

        env_file:
          - /etc/pterodactyl/database.env

        volume:
          - "{{ pterodactyl_data_dir }}/database:/var/lib/mysql"

        command:
          - --default-authentication-plugin=mysql_native_password

        restart_policy: always
        stop_timeout: 120

        recreate: "{{ pterodactyl_db_env.changed }}"

    - name: Run Pterodactyl Redis
      containers.podman.podman_container:
        name: pterodactyl-cache
        image: "{{ pterodactyl_redis_image }}"
        state: started
        pull: missing

        network:
          - pterodactyl-panel

        volume:
          - "{{ pterodactyl_data_dir }}/redis:/data:U"

        restart_policy: always
        stop_timeout: 30

    - name: Run Pterodactyl Panel
      containers.podman.podman_container:
        name: pterodactyl-panel
        image: "{{ pterodactyl_panel_image }}"
        state: started
        pull: missing

        network:
          - pterodactyl-panel

        requires:
          - pterodactyl-db
          - pterodactyl-cache

        env_file:
          - /etc/pterodactyl/panel.env

        publish:
          - "{{ pterodactyl_panel_http_port }}:80"

        volume:
          - "{{ pterodactyl_data_dir }}/var:/app/var"
          - "{{ pterodactyl_data_dir }}/nginx:/etc/nginx/http.d"
          - "{{ pterodactyl_data_dir }}/certs:/etc/letsencrypt"
          - "{{ pterodactyl_data_dir }}/logs:/app/storage/logs"

        restart_policy: always
        stop_timeout: 60

        recreate: "{{ pterodactyl_panel_env.changed }}"

    - name: Wait for Pterodactyl login page
      ansible.builtin.uri:
        url: "{{ pterodactyl_panel_url }}/auth/login"
        method: GET
        status_code: 200
        validate_certs: false
      register: pterodactyl_panel_http
      retries: 30
      delay: 5
      until: pterodactyl_panel_http.status == 200